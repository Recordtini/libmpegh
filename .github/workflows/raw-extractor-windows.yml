name: Build Windows MPEG-H Scene Explorer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - raw-materials-windows
    paths:
      - "decoder/**"
      - "test/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/raw-extractor-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build-raw -A x64

      - name: Build decoder backend
        run: cmake --build build-raw --config Release --target ia_mpeghd_testbench

      - name: Build GUI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "MPEGH Scene Explorer" "tools/mpegh_scene_explorer.py"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/MPEGH Scene Explorer.exe" "package/MPEGH Scene Explorer.exe"
          Copy-Item "build-raw/Release/ia_mpeghd_testbench.exe" "package/mpegh_backend.exe"
          @"
          MPEG-H Scene Explorer

          Run "MPEGH Scene Explorer.exe", then open an MPEG-H M4A/MP4.

          The app decodes the file once into a temporary workspace and shows:
          - raw audio objects
          - channel/bed signals
          - HOA transport signals
          - rendered speaker outputs
          - object position metadata when available

          Objects are selected for export by default. You can preview a row and
          check/uncheck exactly what you want to export.

          Keep mpegh_backend.exe beside the GUI EXE.
          "@ | Set-Content -Encoding ASCII "package/README.txt"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: mpegh-scene-explorer-windows-x64
          path: package/
